apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-collection-combined-knowledge
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-collection-name: combined-knowledge
    trustyai.opendatahub.io/evalhub-collection-type: system
data:
  combined-knowledge.yaml: |
    id: combined-knowledge
    name: combined-knowledge
    category: knowledge
    description: 'Comprehensive knowledge suite combining inspect-knowledge, lighteval-knowledge, and lighteval-language-understanding.
      Deduplicates TruthfulQA (inspect/truthfulqa retained; lighteval logprob variants dropped). MMLU (Hendrycks et al. 2021,
      57 subjects, threshold 0.62 = lower bound of top-10 open <80B competitive 8B range; weight 2.0 — primary knowledge gate)
      anchors the collection. TruthfulQA MC (Lin et al. 2022, threshold 0.50 = paper-recommended competency floor, weight 1.5)
      gates factual calibration. TriviaQA (threshold 0.60, weight 1.5) and OpenBookQA (threshold 0.75, weight 1.5) test retrieval
      across closed and open-domain questions. GLUE tasks (CoLA threshold 0.70 / MRPC threshold 0.82 / SST-2 threshold 0.88, weights
      1.0 / 1.0 / 0.5) capture linguistic understanding with SST-2 down-weighted to 0.5 due to near-saturation (top-10 >92%).
      Global PASS requires mmlu ≥ 0.62 AND truthfulqa ≥ 0.50 plus ≥ 3 of remaining 5 benchmarks.
    
      '
    tags:
    - knowledge
    - factuality
    - truthfulness
    - mmlu
    - language-understanding
    - glue
    - inspect
    - lighteval
    pass_criteria:
      threshold: 0.6
    benchmarks:
    - id: inspect/truthfulqa
      provider_id: inspect
      weight: 1.5
      parameters:
        max_samples: 200
      primary_score:
        metric: choice/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.5
    - id: mmlu
      provider_id: lighteval
      weight: 2.0
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.62
    - id: triviaqa
      provider_id: lighteval
      weight: 1.5
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.6
    - id: openbookqa
      provider_id: lighteval
      weight: 1.5
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.68
    - id: glue:cola
      provider_id: lighteval
      weight: 1.0
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.7
    - id: glue:sst2
      provider_id: lighteval
      weight: 0.5
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.88
    - id: glue:mrpc
      provider_id: lighteval
      weight: 1.0
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.82
    

