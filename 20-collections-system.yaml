apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-collection-combined-coding
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-collection-name: combined-coding
    trustyai.opendatahub.io/evalhub-collection-type: system
data:
  combined-coding.yaml: |
    id: combined-coding
    name: combined-coding
    category: coding
    description: 'Comprehensive coding suite combining inspect-coding and lighteval-code. Five benchmarks across four dimensions:
      (1) Python synthesis (HumanEval, Chen et al. 2021, threshold 0.65 = leaderboard lower bound, weight 2.0 — primary gate);
      (2) broader Python (MBPP, Austin et al. 2021, threshold 0.55, weight 1.5); (3) competitive programming (LiveCodeBench v6,
      Jain et al. 2024, threshold 0.20 = competitive 8B lower bound per artificialanalysis.ai, weight 2.0 — contamination-free,
      highest discrimination); (4) real-world issues (SWE-bench, Jimenez et al. 2024, threshold 0.10 model-only, weight 1.5 —
      untested in current image); (5) library calling (BigCodeBench, Zhuo et al. 2024, threshold 0.45, weight 1.5). Global PASS:
      humaneval>=0.65 AND lcb>=0.20 plus >=1 of {mbpp, swe-bench, bigcodebench}. Full justification in YAML comments.
    
      '
    tags:
    - coding
    - python
    - competitive-programming
    - software-engineering
    - inspect
    - lighteval
    - humaneval
    - swe-bench
    pass_criteria:
      threshold: 0.3
    benchmarks:
    - id: inspect/humaneval
      provider_id: inspect
      weight: 2.0
      parameters:
        max_samples: 100
      primary_score:
        metric: verify/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.65
    - id: inspect/mbpp
      provider_id: inspect
      weight: 1.5
      parameters:
        max_samples: 50
      primary_score:
        metric: accuracy/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.55
    - id: inspect/swe-bench
      provider_id: inspect
      weight: 1.5
      parameters:
        max_samples: 10
      primary_score:
        metric: accuracy/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.1
    - id: inspect/bigcodebench
      provider_id: inspect
      weight: 1.5
      parameters:
        max_samples: 50
      primary_score:
        metric: accuracy/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.45
    - id: lcb:codegeneration_v6
      provider_id: lighteval
      weight: 2.0
      parameters: {}
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.2
    

