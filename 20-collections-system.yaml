# System-level collection ConfigMaps
# Registers all custom collections via operator ConfigMap for stable string IDs.
# Apply as cluster-admin — operator copies to project1 automatically.
#
# Usage:
#   oc apply -f 20-collections-system.yaml   # cluster-admin
#   # Then apply 04-evalhub-cr.yaml (includes collections in spec.collections)
#   uv run evalhub collections list            # verify stable string IDs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-collection-combined-reasoning
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-collection-name: combined-reasoning
    trustyai.opendatahub.io/evalhub-collection-type: system
data:
  combined-reasoning.yaml: |
    id: combined-reasoning
    name: combined-reasoning
    category: reasoning
    description: 'Comprehensive reasoning suite combining inspect-reasoning and lighteval math. Nine benchmarks across four dimensions:
      (1) grade-school math (GSM8K, Cobbe et al. 2021, threshold 0.70 = leaderboard lower bound, weight 2.0 — primary gate); (2)
      multi-step reasoning (BBH, Suzgun et al. 2023, threshold 0.50, weight 2.0); (3) commonsense NLI (HellaSwag threshold 0.80
      / WinoGrande threshold 0.65, weight 1.0 each — near-saturated, down-weighted); (4) competition math (AIME24/25 threshold
      0.10, weight 1.5 — AIME24 contamination risk noted; MATH-500 threshold 0.50 = lower bound competitive 8B, Lightman et al.
      2023, weight 2.0; algebra 0.60; counting 0.45). Global PASS: gsm8k>=0.70 AND bbh>=0.50 AND math_500>=0.50 plus >=3 of remaining
      6. Full threshold justification in YAML comments.
    
      '
    tags:
    - reasoning
    - math
    - competition
    - commonsense
    - inspect
    - lighteval
    - gsm8k
    - bbh
    - aime
    pass_criteria:
      threshold: 0.45
    benchmarks:
    - id: inspect/gsm8k
      provider_id: inspect
      weight: 2.0
      parameters:
        max_samples: 100
      primary_score:
        metric: match/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.7
    - id: inspect/bbh
      provider_id: inspect
      weight: 2.0
      parameters:
        max_samples: 100
      primary_score:
        metric: bbh_scorer/all
        lower_is_better: false
      pass_criteria:
        threshold: 0.5
    - id: inspect/hellaswag
      provider_id: inspect
      weight: 1.0
      parameters:
        max_samples: 100
      primary_score:
        metric: choice/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.8
    - id: inspect/winogrande
      provider_id: inspect
      weight: 1.0
      parameters:
        max_samples: 100
      primary_score:
        metric: choice/accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.65
    - id: aime24
      provider_id: lighteval
      weight: 1.5
      parameters:
        max_samples: 30
      primary_score:
        metric: aime24|0.pass@k:k=1
        lower_is_better: false
      pass_criteria:
        threshold: 0.1
    - id: aime25
      provider_id: lighteval
      weight: 1.5
      parameters:
        max_samples: 30
      primary_score:
        metric: aime25|0.pass@k:k=1
        lower_is_better: false
      pass_criteria:
        threshold: 0.1
    - id: math_500
      provider_id: lighteval
      weight: 2.0
      parameters:
        max_samples: 100
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.5
    - id: math:algebra
      provider_id: lighteval
      weight: 1.5
      parameters:
        max_samples: 50
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.6
    - id: math:counting_and_probability
      provider_id: lighteval
      weight: 1.5
      parameters:
        max_samples: 50
      primary_score:
        metric: accuracy
        lower_is_better: false
      pass_criteria:
        threshold: 0.45
    

