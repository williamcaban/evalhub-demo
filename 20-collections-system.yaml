apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-collection-guidellm-perf
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-collection-name: guidellm-perf
    trustyai.opendatahub.io/evalhub-collection-type: system
data:
  guidellm-perf.yaml: |
    id: guidellm-perf
    name: guidellm-perf
    category: performance
    description: 'GuideLLM inference performance collection — quick snapshot, auto-sweep for optimal concurrency, and fixed-concurrency
      stress test. Synthetic 256/128 token workload (chat-scale). Primary metric: output_tokens_per_second (higher is better).
    
      '
    tags:
    - performance
    - throughput
    - latency
    - guidellm
    benchmarks:
    - id: quick_perf_test
      provider_id: guidellm
      weight: 1.0
      parameters:
        max_requests: 5
        data: prompt_tokens=256,output_tokens=128
        tokenizer: Qwen/Qwen3-8B
      primary_score:
        metric: requests_per_second
        lower_is_better: false
      pass_criteria:
        threshold: 1.0
    - id: sweep
      provider_id: guidellm
      weight: 2.0
      parameters:
        max_requests: 20
        data: prompt_tokens=256,output_tokens=128
        tokenizer: Qwen/Qwen3-8B
      primary_score:
        metric: output_tokens_per_second
        lower_is_better: false
      pass_criteria:
        threshold: 10.0
    - id: concurrent
      provider_id: guidellm
      weight: 2.0
      parameters:
        max_requests: 10
        data: prompt_tokens=256,output_tokens=128
        tokenizer: Qwen/Qwen3-8B
      primary_score:
        metric: output_tokens_per_second
        lower_is_better: false
      pass_criteria:
        threshold: 10.0
    
