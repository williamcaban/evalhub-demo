# Perses Datasource — EvalHub user-workload metrics
#
# Prerequisites (cluster-admin, once per cluster):
#   1. COO installed: oc apply -f 26-cluster-observability-operator.yaml
#   2. UIPlugin enabled: oc apply -f 26-uiplugin-monitoring.yaml
#      oc wait --for=condition=Available uiplugin monitoring --timeout=120s
#
# Authentication note:
#   No static secret is needed. The Perses instance uses kubernetesAuth
#   (enabled in the Perses CR by COO) to forward the user's Kubernetes token
#   when proxying requests to the Thanos querier. The token is the user's own
#   OpenShift session token — Perses passes it through automatically.
#   The user must have 'view' permission in project1 to see the metrics.
#
# TLS note:
#   The Thanos querier at port 9092 uses OpenShift service serving certificates.
#   The CA cert is mounted into the Perses pod at /ca/service-ca.crt by COO.
#   This is referenced via the Perses-internal secret created automatically by
#   the operator when this PersesDatasource is reconciled.
#
# Apply:
#   oc apply -f 25-perses-datasource.yaml
#   oc apply -f 25-perses-dashboard.yaml
#
# Verify:
#   oc get persesdatasource evalhub-user-workload-monitoring -n project1 \
#     -o jsonpath='{.status.conditions[*].message}'
#
# View:
#   OpenShift Console → Observe → Dashboards (Perses) → select namespace: project1

---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: evalhub-user-workload-monitoring
  namespace: project1
  labels:
    app: evalhub-continuous-eval
    component: monitoring
spec:
  config:
    default: true
    display:
      name: "EvalHub — User Workload Monitoring"
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            # Thanos querier port 9092 — user-workload metrics scoped to project1.
            # Auth: Perses forwards the user's Kubernetes token (kubernetesAuth).
            # TLS: service CA cert mounted at /ca/service-ca.crt by COO.
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092?namespace=project1
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
