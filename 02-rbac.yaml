---
# ServiceAccount for EvalHub CLI/SDK access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evalhub-user-sa
  namespace: hermes-sandbox
---
# Role granting access to EvalHub pseudo-resources.
# EvalHub's auth middleware does SubjectAccessReview checks against these resources
# for each API endpoint:
#   /api/v1/evaluations/providers  → trustyai.opendatahub.io/providers
#   /api/v1/evaluations/jobs       → trustyai.opendatahub.io/evaluations
#                                  → mlflow.kubeflow.org/experiments  (on POST)
#   /api/v1/evaluations/collections → trustyai.opendatahub.io/collections
#   /api/v1/evaluations/jobs/*/events → trustyai.opendatahub.io/status-events
#
# The mlflow.kubeflow.org/{experiments,runs} grants below also cover callers that
# talk to MLflow directly via the eval-hub-sdk's own MlflowClient (e.g. an adapter
# running in EVALHUB_MODE=local, bypassing the EvalHub server entirely) rather than
# through a full EvalHub CR/server. Verified 2026-09-21: `experiments` alone is
# enough for EvalHub-server-mediated logging (EvalHub's own elevated service
# account does the actual MLflow calls in that path), but a direct MlflowClient
# caller also needs `runs` — without it, experiment lookup succeeds and
# `POST /runs/create` then 403s.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalhub-user-role
  namespace: hermes-sandbox
rules:
- apiGroups:
  - trustyai.opendatahub.io
  resources:
  - providers
  - evaluations
  - collections
  - status-events
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - mlflow.kubeflow.org
  resources:
  - experiments
  - runs
  verbs:
  - get
  - list
  - create
  - update
---
# RoleBinding: bind the SA to the role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-user-rb
  namespace: hermes-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-user-role
subjects:
- kind: ServiceAccount
  name: evalhub-user-sa
  namespace: hermes-sandbox
