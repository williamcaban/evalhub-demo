# RBAC for the Hermes SA to deploy evalhub-demo in project1
# Apply with: oc apply -f project1-deployer-rbac.yaml
# (requires cluster-admin or namespace admin in project1)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evalhub-demo-deployer
  namespace: project1
rules:
  # EvalHub CRs + pseudo-resources
  - apiGroups: ["trustyai.opendatahub.io"]
    resources: ["evalhubs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["trustyai.opendatahub.io"]
    resources: ["providers", "evaluations", "collections", "status-events"]
    verbs: ["create", "get", "list", "watch"]
  # MLflow experiment/run access
  - apiGroups: ["mlflow.org"]
    resources: ["experiments", "runs"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  # Core plumbing for the demo
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps", "services", "pods", "pods/log", "persistentvolumeclaims", "events"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # KServe (06-qwen3-judge.yaml local judge, if GPU nodes are added)
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-demo-deployer
  namespace: project1
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes-sandbox
roleRef:
  kind: Role
  name: evalhub-demo-deployer
  apiGroup: rbac.authorization.k8s.io
