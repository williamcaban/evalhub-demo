# Register GuideLLM as a system-level provider with stable string ID "guidellm".
#
# GuideLLM: LLM inference server performance benchmarking (Red Hat AI Innovation)
# Measures throughput, latency (TTFT, ITL), and concurrency scaling.
# No external dataset required — uses synthetic prompt/output token counts.
#
# How it works:
#   1. Apply this file as cluster-admin.
#   2. Apply 04-evalhub-cr.yaml (includes "guidellm" in spec.providers).
#   3. Operator copies ConfigMap to project1; EvalHub registers as id: guidellm.
#
# Usage:
#   oc apply -f 16-guidellm-provider.yaml    # cluster-admin
#   uv run evalhub providers list              # verify: "guidellm" with 7 benchmarks

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trustyai-service-operator-evalhub-provider-guidellm
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: trustyai
    app.opendatahub.io/trustyai: "true"
    platform.opendatahub.io/part-of: trustyai
    trustyai.opendatahub.io/evalhub-provider-name: guidellm
    trustyai.opendatahub.io/evalhub-provider-type: system
data:
  guidellm.yaml: |
    id: guidellm
    name: GuideLLM
    title: GuideLLM
    description: >
      Performance benchmarking framework for LLM inference servers.
      Measures throughput (tokens/s), latency (TTFT, ITL), and concurrency
      scaling across multiple load profiles. Uses synthetic data by default —
      no external dataset required.
    type: community

    agent:
      evaluates:
        - performance
        - throughput
        - latency
      recommended_when:
        - "User wants to benchmark inference server throughput or latency"
        - "User wants to find the optimal concurrency for their model"
        - "Pre-deployment performance gate"
        - "User mentions GuideLLM or vLLM performance"
      target_type: model
      summary: "Inference server performance benchmark — throughput, TTFT, ITL across load profiles"
      complements:
        - lm-evaluation-harness
        - inspect
      hints:
        - "Use quick_perf_test for a fast smoke test (5 requests, ~1 min)"
        - "Use sweep to auto-discover optimal concurrency (longer)"
        - "data parameter: 'prompt_tokens=256,output_tokens=128' is a typical chat scenario"
        - "Metrics: output_tokens_per_second (higher=better), mean_ttft_ms (lower=better)"

    runtime:
      k8s:
        image: quay.io/evalhub/community-guidellm:latest
        entrypoint:
          - python
          - main.py
        cpu_request: 100m
        memory_request: 128Mi
        cpu_limit: 1000m
        memory_limit: 2Gi
      local:
        command: python tests/features/test_data/runtime/main.py

    benchmarks:
      - id: quick_perf_test
        name: Quick performance snapshot
        description: >
          Fast sweep-based evaluation with limited samples for rapid
          performance assessment. Best starting point.
        category: performance
        metrics: [requests_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, quick, guidellm, suite]
        primary_score:
          metric: requests_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 1.0

      - id: sweep
        name: Auto-discover optimal load
        description: >
          Sweeps from low to high concurrency to find the best
          throughput-latency tradeoff automatically.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, throughput, latency, guidellm, auto]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0

      - id: throughput
        name: Maximum throughput discovery
        description: >
          Finds the server's maximum requests-per-second by gradually
          increasing load until saturation.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, throughput, guidellm, saturation]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0

      - id: concurrent
        name: Fixed concurrency stress test
        description: >
          Measures latency and throughput under a fixed number of
          simultaneous requests.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, concurrency, guidellm]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0

      - id: constant
        name: Steady-state load test
        description: >
          Measures performance under a sustained, constant request rate
          over time.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, constant_rate, guidellm]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0

      - id: poisson
        name: Realistic traffic simulation
        description: >
          Simulates real-world traffic patterns using Poisson-distributed
          request arrivals.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, poisson, realistic, guidellm]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0

      - id: comprehensive_perf_test
        name: Full performance characterization
        description: >
          End-to-end evaluation across all load profiles for complete
          performance understanding.
        category: performance
        metrics: [requests_per_second, prompt_tokens_per_second, output_tokens_per_second, mean_ttft_ms, mean_itl_ms]
        tags: [performance, comprehensive, guidellm, suite]
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 10.0
