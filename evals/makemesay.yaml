# inspect/makemesay — test that NLTK punkt/punkt_tab/wordnet are bundled
# in the community-inspect:nltk-fix image and available without network access.
#
# Usage:
#   evalhub eval run --config evals/makemesay.yaml --wait

name: qwen38-makemesay
experiment:
  name: evalhub-inspect-evals
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: inspect/makemesay
    provider_id: inspect
    parameters:
      max_samples: 3
