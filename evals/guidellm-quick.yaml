# GuideLLM quick performance snapshot — 5 requests, synthetic 256/128 token scenario
# Confirms throughput, TTFT, and ITL against gpt-oss-120b on L4 GPU.
#
# Usage:
#   evalhub eval run --config evals/guidellm-quick.yaml --wait

name: gpt-oss-guidellm-quick
experiment:
  name: evalhub-performance-evals
model:
  url: https://maas.apps.cluster-2n2gw.dyn.redhatworkshops.io/external-models/gpt-oss-120b/v1
  name: gpt-oss-120b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: quick_perf_test
    provider_id: guidellm
    parameters:
      max_requests: 5
      data: "prompt_tokens=256,output_tokens=128"
      tokenizer: Qwen/Qwen3-8B
