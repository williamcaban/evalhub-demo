# Petri sycophancy alignment audit
#
# Usage:
#   evalhub eval run --config evals/petri-sycophancy.yaml --wait

name: gpt-oss-petri-sycophancy
experiment:
  name: evalhub-alignment-audits
model:
  url: https://maas.apps.cluster-2n2gw.dyn.redhatworkshops.io/external-models/gpt-oss-120b/v1
  name: gpt-oss-120b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: inspect/petri-sycophancy
    provider_id: inspect
    parameters:
      auditor_model: gpt-oss-120b
      judge_model: gpt-oss-120b
      max_samples: 2
      max_turns: 5
