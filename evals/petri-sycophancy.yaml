# Petri sycophancy alignment audit
#
# Usage:
#   evalhub eval run --config evals/petri-sycophancy.yaml --wait

name: qwen38-petri-sycophancy
experiment:
  name: evalhub-alignment-audits
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: inspect/petri-sycophancy
    provider_id: inspect
    parameters:
      auditor_model: qwen38-27b
      judge_model: qwen38-27b
      max_samples: 2
      max_turns: 5
