# OpenBookQA — LightEval knowledge benchmark
#
# A small standalone CLI example. The full benchmark contains 500 examples;
# this demo configuration runs 10 samples against the TMM MaaS model.
#
# Usage:
#   uv run evalhub eval run --config evals/openbookqa.yaml --wait

name: qwen38-openbookqa-demo
experiment:
  name: evalhub-lighteval-evals
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: openbookqa
    provider_id: lighteval
    parameters:
      num_examples: 10
