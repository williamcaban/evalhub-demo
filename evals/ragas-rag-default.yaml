# RAGAS RAG Default Suite
# Evaluates RAG pipeline quality: faithfulness, answer relevancy,
# context precision/recall, answer correctness.
# Uses the model endpoint as the LLM judge.
#
# Usage:
#   evalhub eval run --config evals/ragas-rag-default.yaml --wait

name: qwen38-ragas-default
experiment:
  name: evalhub-rag-evals
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: ragas_rag_default
    provider_id: ragas
    parameters:
      max_workers: 1
      data_path: /bundled-data/dataset.jsonl
