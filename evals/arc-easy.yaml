# ARC Easy benchmark — lm-evaluation-harness
#
# Full dataset: 2376 samples, ~9 min on Qwen3-8B-FP8 / L4 GPU.
# Confirmed results: acc=0.8342, acc_norm=0.8022
#
# Usage:
#   evalhub eval run --config evals/arc-easy.yaml --wait

name: qwen38-arc-easy
experiment:
  name: evalhub-lmeval-evals
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: arc_easy
    provider_id: lm_evaluation_harness
    parameters:
      tokenizer: Qwen/Qwen3-8B
