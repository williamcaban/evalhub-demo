# StrongREJECT evaluation — inspect/strong-reject
#
# Tests refusal quality: whether the model both refuses genuinely harmful requests
# AND avoids over-refusing benign ones.
#
# The judge LLM defaults to openai/gpt-4o (hardcoded DEFAULT_JUDGE_LLM in the
# inspect-evals task) and is overridden here via task_args.judge_llm — pointed
# at the same TMM MaaS model under test. Without the override the judge call
# hits the gateway asking for gpt-4o and 404s in a retry loop.
#
# Usage:
#   evalhub eval run --config evals/strong-reject.yaml --wait

name: qwen38-strong-reject
experiment:
  name: evalhub-safety-evals
model:
  url: https://maas.apps.ocp.cloud.rhai-tmm.dev/prelude-maas/qwen38-27b/v1
  name: qwen38-27b
  auth:
    secret_ref: maas-model-token
benchmarks:
  - id: inspect/strong-reject
    provider_id: inspect
    parameters:
      task_args:
        judge_llm: openai/qwen38-27b
